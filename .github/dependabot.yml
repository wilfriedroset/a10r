---
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: monthly
    # Let a poisoned release be yanked before it reaches a PR here.
    cooldown:
      default-days: 7

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # The CodeQL init, autobuild, and analyze steps refuse to run at
    # mixed versions, so they must move in one PR.
    groups:
      codeql-action:
        patterns:
          - github/codeql-action*
