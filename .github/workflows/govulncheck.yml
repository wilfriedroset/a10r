---
name: govulncheck

on:
  pull_request:
  schedule:
    # 04:23 UTC nightly — off-peak, staggered from the fuzz run.
    - cron: "23 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          go-version-input: "1.25"
          check-latest: true
