---
name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  # Docker images pushed to ghcr.io by goreleaser.
  packages: write
  # Keyless build-provenance attestations via Sigstore (GitHub OIDC).
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    name: goreleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: 'go.mod'

      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0.24.2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # Multi-platform push needs a docker-container buildx builder;
      # the runner's default docker driver cannot export manifest lists.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Attest release artifacts
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.deb
            dist/*.rpm
            dist/*.apk
