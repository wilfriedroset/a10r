---
name: stale

on:
  schedule:
    # 01:30 UTC daily.
    - cron: "30 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale:
    name: stale
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 90
          days-before-close: 30
          exempt-issue-labels: keep-open,pinned
          exempt-pr-labels: keep-open,pinned
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has been quiet for 90 days. a10r is a
            spare-time project, so things sometimes sit — no worries.
            It will close in 30 days unless there is new activity. A
            comment, or the `keep-open` label, keeps it open.
          stale-pr-message: >
            This PR has been quiet for 90 days. It will close in 30
            days unless there is new activity. A comment, or the
            `keep-open` label, keeps it open — reopen any time.
          close-issue-message: >
            Closing as stale. This is not a judgement on the
            report — reopen it any time if it is still relevant.
          close-pr-message: >
            Closing as stale. Reopen any time if you want to pick it
            back up.
