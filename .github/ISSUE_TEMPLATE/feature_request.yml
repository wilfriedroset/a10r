---
name: Feature request
description: Suggest a capability or change
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        a10r is a spare-time project; the fastest path to a feature
        is a well-tested PR, not a request. That said, well-framed
        ideas are welcome — start with the problem, not the solution.

  - type: textarea
    id: problem
    attributes:
      label: Problem statement
      description: What are you trying to do that a10r makes hard or impossible today?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the ideal behaviour look like?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why they fall short.
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Anything else — links, screenshots, related issues.
    validations:
      required: false
