---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-executables-have-shebangs
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-symlinks
      - id: check-json
      - id: detect-private-key
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: pretty-format-json
        args: [--autofix, --no-sort-keys]

  - repo: https://github.com/golangci/golangci-lint
    rev: v2.13.2
    hooks:
      # language_version pinned: prek otherwise provisions Go 1.24.6,
      # which cannot build golangci-lint v2.13.2 (go.mod requires >= 1.26.0).
      - id: golangci-lint
        language_version: "1.27"

  - repo: local
    hooks:
      # govulncheck ./...
      - id: govulncheck
        name: govulncheck
        entry: govulncheck ./...
        language: system
        pass_filenames: false
        types: [go]

      # Comment-density regression guard (ADR 0041).
      - id: lint-comments
        name: comment-density budget
        entry: scripts/lint-comments.sh
        language: script
        pass_filenames: false
        types: [go]

  - repo: https://github.com/Lucas-C/pre-commit-hooks
    rev: v1.5.5
    hooks:
      - id: insert-license
        name: Insert SPDX identifier in Go files
        files: \.go$
        args:
          - --license-filepath=.spdx-header.txt
          - --comment-style=//
          - --no-extra-eol
