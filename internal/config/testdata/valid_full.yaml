defaults:
  poll_interval: 30s
  read_only: false
  log_format: json
  bulk_concurrency: 4

theme:
  name: gruvbox-dark

log:
  path: /var/log/a10r/a10r.log
  level: info

tui:
  tips: true
  tips_interval: 12s
  terminal_title: true
  poll_delta: true
  remember: true
  notify:
    enabled: true
    bell: false
    desktop: both
    min_severity: critical
    command: ["notify-send", "a10r", "$MESSAGE"]

backends:
  - name: prod-vanilla
    url: https://am-prod.internal
    bearer_token: ${A10R_PROD_TOKEN}

  - name: staging-mimir
    url: https://mimir-staging.internal
    prefix: /alertmanager
    tenant_header: X-Scope-OrgID
    tenant: tenant-a
    capabilities:
      config_api: true
      tenant_admin: true
      ring: false
    basic_auth:
      username: a10r-bot
      password: ${A10R_STAGING_PASS}
    tls_config:
      ca: |
        -----BEGIN CERTIFICATE-----
        MIIBkTCB+wIJAKHHIgIIsgqrMA0GCSqGSIb3DQEBCwUAMA0xCzAJBgNVBAYTAlVT
        -----END CERTIFICATE-----
      server_name: mimir-staging.internal
      insecure_skip_verify: false
      min_version: TLS12
    proxy_url: http://proxy.internal:3128
    no_proxy: 127.0.0.1,localhost,.svc.cluster.local
    remote_timeout: 15s
    poll_interval: 10s
    read_only: true

  - name: gateway-headers
    url: https://am-via-gateway.example
    headers:
      X-Gateway-Token: ${A10R_GW_TOKEN}
      X-Trace-Id: a10r

guardrails:
  - tenants: ["prod-*"]
    actions: ["silence.expire"]
    deny: true
    reason: expire prod silences from the change ticket, not a10r
  - tenants: ["prod-*"]
    confirmation: type-tenant-name
  - max_bulk: 20

pages:
  alerts:
    poll_interval: 5s
    columns:
      - label: cluster
        title: CLUSTER
        sort_key: L
        width: 12
      - label: namespace
        wide: true
  group_detail:
    columns:
      - label: pod
        sort_key: P
  silences:
    poll_interval: 20s
  receivers:
    poll_interval: 60s
  status:
    poll_interval: 45s
