---
name: gruvbox-dark
description: Gruvbox dark medium — proves the role map across palette philosophies
author: Pavel Pertsev (morhetz/gruvbox)

palette:
  base:     "#282828"
  surface:  "#3c3836"
  text:     "#ebdbb2"
  subtext:  "#a89984"
  overlay:  "#928374"
  red:      "#fb4934"
  peach:    "#fe8019"
  yellow:   "#fabd2f"
  green:    "#b8bb26"
  sky:      "#83a598"
  blue:     "#458588"
  lavender: "#d3869b"

roles:
  body:
    fg: text
    bg: base

  header:
    fg: text
    bg: base
    accent: blue
    ok: green
    warn: yellow
    error: red

  table:
    header:        { fg: subtext, bg: base }
    header_active: { fg: base, bg: blue }
    row:           { fg: text, bg: base }
    row_alt:       { fg: text, bg: surface }
    cursor:        { fg: base, bg: lavender }
    marked:        { fg: base, bg: peach }
    dimmed:        { fg: overlay, bg: base }

  severity:
    critical: red
    warning:  yellow
    info:     sky
    unknown:  overlay

  silence_state:
    active:  green
    pending: yellow
    expired: overlay

  prompt:
    fg: text
    bg: base
    suggestion: overlay

  flash:
    success: green
    info:    sky
    warn:    yellow
    error:   red

  crumbs:
    fg: subtext
    bg: base
    active: peach

  hint:
    fg: subtext
    bg: base
    key: peach
    help_key: green

  modal:
    fg: text
    bg: base
    border: overlay

  yaml:
    key:   blue
    value: text
    punct: overlay
