---
name: catppuccin-frappe
description: Catppuccin Frappé (warm dark) — softer than mocha, less stark
author: Catppuccin authors

palette:
  rosewater: "#f2d5cf"
  flamingo:  "#eebebe"
  pink:      "#f4b8e4"
  mauve:     "#ca9ee6"
  red:       "#e78284"
  maroon:    "#ea999c"
  peach:     "#ef9f76"
  yellow:    "#e5c890"
  green:     "#a6d189"
  teal:      "#81c8be"
  sky:       "#99d1db"
  sapphire:  "#85c1dc"
  blue:      "#8caaee"
  lavender:  "#babbf1"
  text:      "#c6d0f5"
  subtext:   "#a5adce"
  overlay:   "#737994"
  surface:   "#414559"
  base:      "#303446"
  mantle:    "#292c3c"
  crust:     "#232634"

roles:
  body:
    fg: text
    bg: base

  header:
    fg: text
    bg: base
    accent: blue
    ok: green
    warn: yellow
    error: red

  table:
    header:        { fg: yellow, bg: base }
    header_active: { fg: sky,    bg: base }
    row:           { fg: text,   bg: base }
    row_alt:       { fg: text,   bg: surface }
    cursor:        { fg: base,   bg: lavender }
    marked:        { fg: rosewater, bg: base }
    dimmed:        { fg: overlay, bg: base }

  severity:
    critical: red
    warning:  yellow
    info:     sky
    unknown:  overlay

  silence_state:
    active:  green
    pending: yellow
    expired: overlay

  prompt:
    fg: text
    bg: mantle
    suggestion: blue

  flash:
    success: green
    info:    sky
    warn:    yellow
    error:   red

  crumbs:
    fg: base
    bg: maroon
    active: flamingo

  hint:
    fg: subtext
    bg: base
    key: blue
    help_key: green

  modal:
    fg: text
    bg: base
    border: mauve

  yaml:
    key:   blue
    value: text
    punct: subtext
