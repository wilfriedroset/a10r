---
name: catppuccin-macchiato
description: Catppuccin Macchiato (medium dark) — between frappé and mocha
author: Catppuccin authors

palette:
  rosewater: "#f4dbd6"
  flamingo:  "#f0c6c6"
  pink:      "#f5bde6"
  mauve:     "#c6a0f6"
  red:       "#ed8796"
  maroon:    "#ee99a0"
  peach:     "#f5a97f"
  yellow:    "#eed49f"
  green:     "#a6da95"
  teal:      "#8bd5ca"
  sky:       "#91d7e3"
  sapphire:  "#7dc4e4"
  blue:      "#8aadf4"
  lavender:  "#b7bdf8"
  text:      "#cad3f5"
  subtext:   "#a5adcb"
  overlay:   "#6e738d"
  surface:   "#363a4f"
  base:      "#24273a"
  mantle:    "#1e2030"
  crust:     "#181926"

roles:
  body:
    fg: text
    bg: base

  header:
    fg: text
    bg: base
    accent: blue
    ok: green
    warn: yellow
    error: red

  table:
    header:        { fg: yellow, bg: base }
    header_active: { fg: sky,    bg: base }
    row:           { fg: text,   bg: base }
    row_alt:       { fg: text,   bg: surface }
    cursor:        { fg: base,   bg: lavender }
    marked:        { fg: rosewater, bg: base }
    dimmed:        { fg: overlay, bg: base }

  severity:
    critical: red
    warning:  yellow
    info:     sky
    unknown:  overlay

  silence_state:
    active:  green
    pending: yellow
    expired: overlay

  prompt:
    fg: text
    bg: mantle
    suggestion: blue

  flash:
    success: green
    info:    sky
    warn:    yellow
    error:   red

  crumbs:
    fg: base
    bg: maroon
    active: flamingo

  hint:
    fg: subtext
    bg: base
    key: blue
    help_key: green

  modal:
    fg: text
    bg: base
    border: mauve

  yaml:
    key:   blue
    value: text
    punct: subtext
